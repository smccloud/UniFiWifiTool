<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1120" />
    <title>{% block title %}UniFi WiFi Access Manager{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark">◎</span>
        <span>
          <strong>UniFi WiFi Access Manager</strong>
          <small>Anonymous install stats</small>
        </span>
      </a>
      <nav>
        <a href="/">Public stats</a>
        <a href="/admin">Admin</a>
        <a href="https://github.com/smccloud/UniFiWifiTool">GitHub</a>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>
      No IP addresses or network/device identifiers are collected.
    </footer>
  </body>
</html>
