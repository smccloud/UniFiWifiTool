services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smccloud/unifi-wifi-tool:${IMAGE_VERSION:-0.9.0}
    container_name: unifi-wifi-tool
    restart: unless-stopped
    init: true
    env_file:
      - ${ENV_FILE:-.env}
    ports:
      - "${APP_PORT:-8080}:8000"
    volumes:
      - unifi-wifi-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  unifi-wifi-data:
